name: prisma

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - .env
    environment:
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-local}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      DATABASE_URL: postgresql+asyncpg://prisma:prisma@pj-postgres:5432/prisma_pj
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@pj-redis:6379/0
    depends_on:
      pj-postgres:
        condition: service_healthy
      pj-redis:
        condition: service_healthy

  pj-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prisma_pj
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - prisma_pj_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d prisma_pj"]
      interval: 5s
      timeout: 5s
      retries: 10

  pj-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}

volumes:
  prisma_pj_pg:
