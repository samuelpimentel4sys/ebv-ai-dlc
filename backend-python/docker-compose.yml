services:
  api:
    build: .
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-local}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      DATABASE_URL: postgresql+asyncpg://prisma:prisma@postgres:5432/prisma_pj
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prisma_pj
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    ports:
      - "5433:5432"
    volumes:
      - prisma_pj_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d prisma_pj"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prisma_pj_pg:
