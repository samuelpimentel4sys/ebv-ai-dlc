[project]
name = "prisma-pj"
version = "0.1.0"
description = "PRISMA-EP-03 Copiloto GenAI PJ — FastAPI hexagonal (LLM multi-provider)"
readme = "README.md"
authors = [
    { name = "SolutionCenter4Sys", email = "solutioncenter@foursys.com.br" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pgvector>=0.3",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
prisma-pj = "prisma_pj.presentation.main:run"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "greenlet>=3.0",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["PLR2004", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]
"src/prisma_pj/presentation/main.py" = ["S104"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["prisma_pj"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=prisma_pj --cov-report=term-missing --cov-fail-under=55"

[tool.coverage.run]
source = ["src/prisma_pj"]
omit = ["*/presentation/main.py"]
