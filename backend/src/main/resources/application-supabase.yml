# Profile: Supabase Prisma Equifax (sem secrets no git)
# Uso:
#   set SPRING_DATASOURCE_PASSWORD=<database password do dashboard>
#   mvn spring-boot:run -Dspring-boot.run.profiles=supabase

spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    # Pooler IPv4 — db.* direto é IPv6-only (Java Windows: UnknownHostException)
    url: jdbc:postgresql://aws-0-ca-central-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: ${SPRING_DATASOURCE_USERNAME:postgres.jrpjrvttiqustpfedxdz}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    # Tabelas já aplicadas via MCP; IF NOT EXISTS torna reexecução segura
    baseline-on-migrate: true
