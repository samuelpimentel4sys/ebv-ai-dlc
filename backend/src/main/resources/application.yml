spring:
  application:
    name: prisma-backend
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:prisma}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:prisma}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:prisma}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

prisma:
  identity:
    auto-merge-threshold: ${IDENTITY_AUTO_MERGE_THRESHOLD:0.95}
    human-review-threshold: ${IDENTITY_HUMAN_REVIEW_THRESHOLD:0.70}
  kafka:
    topic-credit-events: ${KAFKA_TOPIC_CREDIT:prisma.credit.events}
    topic-identity-corrections: ${KAFKA_TOPIC_IDENTITY:prisma.identity.corrections}
    partition-count: ${KAFKA_PARTITION_COUNT:6}
  worm:
    backend: ${PRISMA_WORM_BACKEND:fs}
    base-path: ${PRISMA_WORM_BASE_PATH:./data/worm}
    fail: ${PRISMA_WORM_FAIL:false}
    s3:
      bucket: ${PRISMA_WORM_S3_BUCKET:}
      prefix: ${PRISMA_WORM_S3_PREFIX:decisions/}
      region: ${PRISMA_WORM_S3_REGION:us-east-1}
      retention-years: ${PRISMA_WORM_S3_RETENTION_YEARS:5}
      # MinIO lab: http://192.168.31.47:9000 — vazio = AWS S3 real
      endpoint: ${PRISMA_WORM_S3_ENDPOINT:}
      path-style: ${PRISMA_WORM_S3_PATH_STYLE:true}
  audit-worm:
    backend: ${PRISMA_AUDIT_WORM_BACKEND:fs}
    base-path: ${PRISMA_AUDIT_WORM_BASE_PATH:./data/audit-worm}
    fail: ${PRISMA_AUDIT_WORM_FAIL:false}
    s3:
      bucket: ${PRISMA_AUDIT_WORM_S3_BUCKET:${PRISMA_WORM_S3_BUCKET:}}
      prefix: ${PRISMA_AUDIT_WORM_S3_PREFIX:audit/}
      retention-years: ${PRISMA_AUDIT_WORM_S3_RETENTION_YEARS:5}
  dispute-evidence:
    base-path: ${PRISMA_DISPUTE_EVIDENCE_PATH:./data/dispute-evidence}
  cors:
    allowed-origins: ${PRISMA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  graph:
    backend: ${GRAPH_BACKEND:stub}
    neo4j:
      uri: ${NEO4J_URI:bolt://localhost:7687}
      user: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:}
  onnx:
    mode: ${ONNX_MODE:stub}
    scorer-url: ${ONNX_SCORER_URL:http://localhost:8091}
    model-path: ${ONNX_MODEL_PATH:}
  fairlearn:
    enabled: ${FAIRLEARN_ENABLED:false}
    url: ${FAIRLEARN_URL:http://localhost:8092}
  liveness:
    mode: ${LIVENESS_MODE:stub}
    mock-url: ${LIVENESS_MOCK_URL:http://localhost:8093}
    term-version: ${BIOMETRIC_TERM_VERSION:v1.0}
  lab:
    # OBS-04/06 — lab markers + actor fallback (desligar em staging/prod)
    mark-responses: ${PRISMA_LAB_MARK:true}
    actor-fallback: ${PRISMA_LAB_ACTOR_FALLBACK:true}
  security:
    enabled: ${OIDC_ENABLED:false}

logging:
  level:
    br.com.ebv.prisma: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level correlationId=%X{correlationId} %logger{36} - %msg%n"

---
# Sem profile infra: não sobe Redis/Kafka (evita falha de boot)
spring:
  config:
    activate:
      on-profile: "!infra"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.redis.RedisHealthContributorAutoConfiguration
