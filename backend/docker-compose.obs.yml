# Pacote OBS infra — MinIO + ClamAV + OTel/Jaeger (+ Camunda opcional)
# Uso: docker compose -f docker-compose.obs.yml up -d
# Doc: docs/INSTRUCAO_DOCKER_SERVICOS_OBS.md

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: prisma
      MINIO_ROOT_PASSWORD: prismaPrisma1
    volumes:
      - prisma_obs_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "3310:3310"
    volumes:
      - prisma_obs_clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  jaeger:
    image: jaegertracing/all-in-one:1.66
    ports:
      - "16686:16686"
      - "14250:14250"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    depends_on:
      - jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./docker/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

  camunda:
    profiles: ["camunda"]
    image: camunda/camunda-bpm-platform:run-7.22.0
    ports:
      - "8088:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:./camunda-db/process-engine;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    volumes:
      - prisma_obs_camunda:/camunda/configuration

volumes:
  prisma_obs_minio:
  prisma_obs_clamav:
  prisma_obs_camunda:
