name: prisma

include:
  - docker-compose.liveness.yml

services:
  postgres:
    # pgvector: EP-03 GenAI (RAG) precisa da extensão vector; Java permanece compatível
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prisma
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - prisma_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d prisma"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}

  kafka:
    image: bitnamilegacy/kafka:3.9
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: prisma
      KC_BOOTSTRAP_ADMIN_PASSWORD: prisma
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: "8080"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  app:
    image: prisma-backend:lab
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local,infra
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/prisma
      SPRING_DATASOURCE_USERNAME: prisma
      SPRING_DATASOURCE_PASSWORD: prisma
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_SSL: "false"
      SPRING_DATA_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KAFKA_BOOTSTRAP: kafka:9094
      OIDC_ENABLED: "true"
      OIDC_ISSUER_URI: http://localhost:8180/realms/prisma
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/prisma/protocol/openid-connect/certs
      PRISMA_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000"
      PRISMA_GENAI_ENABLED: "false"
      GRAPH_BACKEND: stub
      ONNX_MODE: stub
      LIVENESS_MODE: http
      LIVENESS_MOCK_URL: http://rekognition-mock:8080
      PRISMA_WORM_BACKEND: fs
      FAIRLEARN_ENABLED: "false"
      MANAGEMENT_HEALTH_NEO4J_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_DATA_MODE: live
        VITE_API_BASE_URL: ""
        VITE_OIDC_ENABLED: "true"
        VITE_OIDC_ISSUER: http://localhost:8180/realms/prisma
        VITE_OIDC_PASSWORD_CLIENT_ID: prisma-lab
        VITE_OIDC_CLIENT_ID: prisma-steward-ui
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - app
      - keycloak

  genai:
    build:
      context: ../backend-python
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - ../backend-python/.env
    environment:
      # Mesmo Postgres local do Java (sem Supabase)
      DATABASE_URL: postgresql+asyncpg://prisma:prisma@postgres:5432/prisma
      DATABASE_SSL: ""
      DATABASE_SSL_INSECURE: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SHOWCASE_MODE: "true"
      OIDC_ENABLED: "false"
      ENVIRONMENT: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  prisma_pg:
    name: backend_prisma_pg
    external: true
