server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker DNS: resolve `app` na hora do request (container pode subir depois).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Token OIDC same-origin (form Prisma → Keycloak sem CORS).
  location /realms/ {
    set $kc keycloak:8080;
    proxy_pass http://$kc;
    proxy_http_version 1.1;
    # Alinha com KC_HOSTNAME=http://localhost:8180 (issuer JWT do BE).
    proxy_set_header Host localhost:8180;
    proxy_set_header X-Forwarded-Host localhost:8180;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    set $upstream app:8080;
    proxy_pass http://$upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /actuator/ {
    set $upstream app:8080;
    proxy_pass http://$upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: index sem cache para não servir menu/JS antigo após redeploy.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
