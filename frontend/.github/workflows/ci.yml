name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, testes, build e orçamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes (Vitest, axe e contraste WCAG)
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Orçamento de performance do Design System
        run: npm run budget

      - name: Publicar artefato do build
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7
